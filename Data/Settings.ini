[General]
; 全局控制热键修饰符: ^ = Ctrl, ! = Alt, + = Shift, # = Win
HotkeyModifier=^!
; 紧急停止: 关闭所有自动化模块
EmergencyStop=Esc
; 游戏进程名
GameExe=gonline.exe

[Game]
; 窗口大小 (用于坐标计算)
WindowWidth=1024
WindowHeight=768
; 输入模式: control=ControlSend(后台), setforeground=先激活再Send
InputMode=control
; 当前服务端配置 (对应 [Server.*] 节)
ServerProfile=NewServer

[AntiAFK]
Enabled=0
; 心跳间隔 (秒)
HeartbeatInterval=300
; 心跳按键 (空格键)
HeartbeatKey=Space
; 断线检测关键词
DisconnectPattern=Socket failed: 10053
; 日志目录 (相对于游戏目录)
LogPath=zoG_log
; 最大重登尝试次数
MaxReconnectAttempts=3
; 重登尝试间隔 (秒)
ReconnectDelay=30

; 登录界面坐标 (1024x768)
Login_UsernameX=1171
Login_UsernameY=677
Login_PasswordX=1179
Login_PasswordY=716
Login_ConfirmX=1024
Login_ConfirmY=834
; 频道选择
Login_ChannelX=512
Login_ChannelY=350

[AutoFarm]
Enabled=0
; 最大刷图次数 (0=无限)
MaxRuns=10
; 关卡选择坐标
Mission_Select_X=800
Mission_Select_Y=200
Mission_Confirm_X=512
Mission_Confirm_Y=500
; 各阶段超时 (秒)
Timeout_Select=30
Timeout_Queue=120
Timeout_Loading=60
Timeout_Battle=600
Timeout_Result=30

[DailyRewards]
Enabled=0
; 领奖菜单按钮坐标
Menu_Reward_X=900
Menu_Reward_Y=50
; 领取按钮检测方式: pixel / image
DetectionMode=pixel
; 按钮像素颜色 (0xRRGGBB)
ButtonColor=0xFFDD00
; 按钮区域 (左上X, 左上Y, 右下X, 右下Y)
ButtonArea=400,300,600,500

[ComboMacros]
Enabled=0
; 按键序列 (JSON格式字符串, 录制后自动填充)
; 每项: {"key":"键名","delay":延迟ms,"count":次数}
Macro1_Sequence=
Macro2_Sequence=
Macro3_Sequence=
Macro4_Sequence=
Macro5_Sequence=
Macro6_Sequence=
Macro7_Sequence=
Macro8_Sequence=

[FarmWatchdog]
Enabled=0
; 刷图停滞或游戏缺失多少秒后触发重启建房
Watch_Duration=180

[Logging]
; 日志级别: DEBUG/INFO/WARN/ERROR
LogLevel=DEBUG
; 保留最近 N 个日志文件
MaxLogFiles=10

[RestartGame]
Enabled=0
; 运行模式: once (单次) / loop (循环建房)
Mode=once
; 最大循环次数 (0=无限, 仅 loop 模式)
MaxLoops=0
; 循环间等待时间 (秒)
LoopDelay=30
; 最大错误重试次数
MaxRetries=3

; 窗口稳定等待时间 (ms) — 游戏窗口出现后等待登录界面加载完成
StabilizeWaitTime=10000

; 启动器"進入游戲"按钮坐标 (相对启动器窗口 Client 区域)
Launcher_Button_X=2288
Launcher_Button_Y=1137
; 启动器加载等待时间 (秒)
Launcher_WaitTime=5

; 菜单导航坐标 — 3步到达任务房间创建界面 (0=跳过该步骤)
; 步骤1: 点击打开任务/战斗菜单
Nav_Step1_X=0
Nav_Step1_Y=0
; 步骤2: 选择 "任务房间" 子菜单
Nav_Step2_X=0
Nav_Step2_Y=0
; 步骤3: 点击 "创建房间" 入口
Nav_Step3_X=0
Nav_Step3_Y=0

; 房间创建界面坐标
Room_Create_X=512
Room_Create_Y=500
Room_MapSelect_X=400
Room_MapSelect_Y=300
Room_Confirm_X=512
Room_Confirm_Y=500

; 各阶段超时 (秒)
Timeout_KillProcess=15
Timeout_LaunchGame=60
Timeout_Stabilize=15
Timeout_Login=60
Timeout_NavigateMenu=30
Timeout_CreateRoom=30
Timeout_Teardown=30

; ===== 服务端配置 =====
; 每个 [Server.*] 节定义一个可切换的私服配置
; 配置优先级: [Server.<ServerProfile>] → [General] → 硬编码默认值
; 在 GUI 设置的"服务端配置"下拉框切换, 或直接修改 [Game] > ServerProfile

[Server.SDGO_UNION]
; 游戏进程名
GameExe=gonline.exe
; 启动器文件名
LauncherExe=SDGO_Launcher.exe
; 游戏目录 (留空=桌面\SDGO UNION 1.4.3)
GameDir=
; 启动器完整路径 (留空=GameDir\LauncherExe)
GamePath=
; 登录密码
LoginPassword=SeewoScott
; 频道检测像素颜色 (0xRRGGBB)
LoginChannelColor=0x071940
; 房间名
RoomName=炸狗房，新手来~
; 日志目录 (留空=GameDir\zoG_log)
LogDir=

[AutoMatch]
Enabled=0
; 最大场次 (0=无限)
MaxRuns=0

; F5 Ready 检测 — 该像素消失即表示已就绪，可以按F5
ReadyPixelX=683
ReadyPixelY=493
ReadyPixelColor=0xFFFFFF
ReadyTimeout=10

; 索敌参数
SeekSteps=18
SeekMouseDelta=50
SeekMaxRounds=4
LockColor=0x73B279
; 结算像素颜色 (九宫格中心区域)
ResultColor=0x25B3D1

; 攻击时长 (秒) — 锁敌后攻击多久开始搜结算色
AttackDuration=60

[Server.NewServer]
; 取消下方注释并修改为你自己的私服配置:
GameExe=gonline.exe
LauncherExe=SDGO_Launcher.exe
; GameDir=
; GamePath=
LoginPassword=
LoginChannelColor=0x071940
; RoomName=
; LogDir=
