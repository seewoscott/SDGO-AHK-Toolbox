[FarmWatchdog]
Enabled=0
; Seconds of stall / game-missing before triggering RestartGame
Watch_Duration=180

[Logging]
; Log level: DEBUG / INFO / WARN / ERROR
LogLevel=DEBUG
; Max recent log files to keep
MaxLogFiles=10

[RestartGame]
Enabled=0
; Run mode: once / loop
Mode=once
; Max loops (0=unlimited, loop mode only)
MaxLoops=0
; Delay between loops (seconds)
LoopDelay=30
; Max error retries
MaxRetries=3

; Window stabilize wait (ms) — wait for login screen after game window appears
StabilizeWaitTime=10000

